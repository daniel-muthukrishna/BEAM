#Root folder of the TICA FFIs, laid out as <fits_folder>/s0022/cam3-ccd1/*.fits (one folder per sector, one per CCD)
fits_folder: /path/to/tica_ffis/

#Folder containing the raw O<orbit>_altaz.out angle files (used by process_angles.py)
raw_angles_folder: /path/to/altaz_files/

#Output folder for processed angle data
angle_folder: /path/to/angles/

#Output folder for processed CCD images
ccd_folder: /path/to/processed_images/

#Output folder for background images
background_ccd_folder: /path/to/background_images/

#Processed angle dictionary pickle to load from angle_folder
angles_dic: angles_O11-116_cam_ALL_data_dic_full.pkl

#(Optional) folder for saving debug images ('' to disable)
display_images_folder: ''
#Target image size

image_size: 256

#Camera to process (1-4). process_angles.py also accepts 'all' (--camera_number all) to store every camera
camera_number: '3'

#Number of workers to use
num_workers: 10

#preprocess_all.py: first and last sector to process (inclusive), and sectors to skip
sector_start: 2
sector_end: 54
skip_sectors: []

#process_angles.py: first and last orbit to process (inclusive), and orbits to skip
orbit_start: 11
orbit_end: 116
skip_orbits: []
