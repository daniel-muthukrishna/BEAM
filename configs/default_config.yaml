# Default configuration for BEAM model training

# Model parameters
model:
  n_T: 600               # Number of diffusion timesteps
  n_feat: 256            # Number of features in U-Net
  betas: [0.0001, 0.02]  # Beta schedule start and end values
  drop_prob: 0.1         # Dropout probability for classifier-free guidance
  
# Data parameters  
data:
  angle_filename: "angles_O11-54_data_dic.pkl"   # Filename for angle data
  ccd_folder: "/pdo/users/jlupoiii/TESS/data/processed_images_im256x256/"  # Folder containing processed images
  image_shape: [256, 256]  # Shape of the images
  num_processes: 80      # Number of processes for parallel loading
  
# Training parameters
training:
  n_epoch: 1000          # Maximum number of epochs
  batch_size: 16         # Batch size
  lrate: 0.0001          # Learning rate
  patience: 150          # Early stopping patience
  
# Checkpoint parameters
checkpoint:
  save_model: true       # Save model checkpoints
  epoch_checkpoint: 100  # Save samples every N epochs
  checkpoint_gpu: 1      # GPU ID to use for checkpoints
  
# Weights & Biases parameters
wandb:
  enabled: True         # Enable W&B logging
  project: "beam-tess"   # W&B project name
  mode: "online"         # W&B mode (online, offline, disabled)
  log_freq: 50           # Log batch metrics every N batches (higher value = less traffic)
  log_samples_freq: 10   # Log sample images every N epochs
  log_model_freq: 50     # Log model weights every N epochs
  model_name: "full-refactor-multigpu-256x256"     # Base name for the model and W&B run
  
# Paths
paths:
  save_dir: "model_outputs/full-refactor-multigpu/"  # Directory to save model and results
  
# Distributed training
distributed:
  world_size: 2       # Number of GPUs (null = auto-detect)
