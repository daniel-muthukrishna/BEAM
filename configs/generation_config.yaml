model:
  n_feat: 128            # Number of features in U-Net
  epsilon: 0.0001          # Bound t for stability
  architecture: "noise"   # Architecture to use for the model
  channel_mults: [1,1,2,2,2]
  heads_at: [2,3,4]
  num_res: 2


data:
  angle_path: "/pdo/users/djtufto/cam3/angles/angles_O11-116_cam_3_data_dic_full.pkl"  # Path to angle data
  ccd_folder: "/pdo/users/djtufto/cam3/tica/tica_sector30"  # Folder containing processed images
  background_path: null  # Folder containing background images
  image_shape: [4096,4096]  # Shape of the images
  patch_size: null # Shape of the patches; null for no patches
  repeat_factor: 1 # Iterate repeat_factor times over the dataset each epoch
  camera_number: '3'
  mean: 0 #Dataset mean (for normalization)
  std: 1 #Dataset standard deviation (for normalization)

# Used for sampling from generate.py 
generation:
  model_path_star: /pdo/users/djtufto/BEAM/model_outputs/cam3_tica_star_256x256/checkpoint_epoch_final_20260615_053537.pth
  batch_size: 1
  output_dir: "model_outputs/sector30/"
  ema: True # Use EMA weights for sampling
  star_mean: 0.01 # Star model normalization mean
  star_std: 0.05 # Star model normalization std
  num_langevin_steps: 50 # Number of Langevin iterations
  langevin_step_size: 0.001 # Step size for each Langevin update
