model:
  n_feat: 128            # Number of features in U-Net
  epsilon: 0.0001          # Bound t for stability
  architecture: "noise"   # Architecture to use for the model
  channel_mults: [1,1,2,2,2]
  heads_at: [2,3,4]
  num_res: 2


data:
  angle_path: "/pdo/users/jlupoiii/TESS/data/angles/angles_O11-54_data_dic.pkl"  # Path to angle data
  ccd_folder: "/pdo/users/jlupoiii/TESS/data/processed_images_im256x256"  # Folder containing processed images
  background_path: null  # Folder containing background images
  image_shape: [256,256]  # Shape of the images
  patch_size: null # Shape of the patches; null for no patches
  repeat_factor: 1 # Iterate repeat_factor times over the dataset each epoch
  camera_number: '3'
  mean: 0.01978608595999928
  std: 0.08876927679677006

# Used for sampling from generate.py
generation:
  model_path: /pdo/users/djtufto/BEAM/model_outputs/conditional_noise/checkpoint_epoch_final_20251022_060121.pth # Path to trained model checkpoint
  model_path_star: /pdo/users/djtufto/BEAM/model_outputs/conditional_noise/checkpoint_epoch_final_20251008_175925.pth # Path to trained model checkpoint
  params_file: "data/params/params_100.pkl" # Path to orbital parameters (pickle file of shape [N, 12])
