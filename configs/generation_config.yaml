# BEAM scattered-light generation (scripts/generate.py)
#
#   python scripts/generate.py --config configs/generation_config.yaml --sector 10
#
# Every key below is required. Which FFIs to generate is chosen on the command line
# (--sector N or --ffi-nums ..., plus --limit, --num-shards, --shard-index).
# Architecture and image settings come from <model_dir>/config.yaml.

generation:
  model_dir: /PATH/TO/MODEL/          # holds config.yaml, checkpoint_epoch_final.pth, context_stats.pkl, image_stats.pkl
  angle_path: /PATH/TO/ANGLES.pkl     # Earth/Moon geometry for each FFI
  output_dir: /PATH/TO/OUTPUT/        # generated FITS files and generation_preview.png
  ema: true                           # sample with EMA weights
  guidance_scale: 1.0                 # classifier-free guidance scale
  num_sde_steps: 500                  # Euler-Maruyama steps (SDE architectures only; 'flow' is adaptive)
  batch_size: 16                      # FFIs per forward pass, per device
  devices: [cuda:0]                   # one worker per device, e.g. [cuda:0, cuda:1] or [cpu]
  seed: null                          # seed for the initial noise; null = nondeterministic
